<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed Mahfouz</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 30px 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 380px;
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      color: #fff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .profile-img-container {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 15px;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .name {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .title {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .link-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
    }

    .link-btn i {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="profile-img-container">
      <img src="z.jpg" alt="Profile Picture" class="profile-img">
    </div>

    <h1 class="name">Ahmed Mahfouz</h1>
    <p class="title">Network Engineer</p>

    <div class="links-container">
      <a href="tel:+201108511453" class="link-btn">
        <i class="fa-solid fa-phone"></i>
        <span>Phone</span>
      </a>

      <a href="https://wa.me/201108511453" target="_blank" class="link-btn">
        <i class="fa-brands fa-whatsapp"></i>
        <span>WhatsApp</span>
      </a>

      <a href="mailto:ahmedmahfouz680@gmail.com" class="link-btn">
        <i class="fa-solid fa-envelope"></i>
        <span>E-mail</span>
      </a>

      <a href="https://www.linkedin.com/in/ahmedmahfouz680/" target="_blank" class="link-btn">
        <i class="fa-brands fa-linkedin"></i>
        <span>LinkedIn</span>
      </a>

      <a href="https://ahmedmahfouz680.github.io/Portfolio/" target="_blank" class="link-btn">
        <i class="fa-solid fa-briefcase"></i>
        <span>Portfolio</span>
      </a>
    </div>
  </div>

</body>
</html>
