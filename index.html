<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ahmed Mahfouz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-color: #070b13;
      --card-bg: rgba(15, 23, 42, 0.82);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 35px rgba(56, 189, 248, 0.07);
      --btn-bg: rgba(255, 255, 255, 0.038);
      --btn-bg-hover: rgba(255, 255, 255, 0.085);
      --btn-border: rgba(255, 255, 255, 0.09);
      --btn-border-hover: rgba(56, 189, 248, 0.45);
      --text-title: #ffffff;
      --text-subtitle: #38bdf8;
      --text-btn: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 18% 18%, rgba(56, 189, 248, 0.16) 0px, transparent 45%),
        radial-gradient(circle at 82% 22%, rgba(99, 102, 241, 0.15) 0px, transparent 48%),
        radial-gradient(circle at 50% 88%, rgba(14, 165, 233, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    .profile-card {
      width: 100%;
      max-width: 410px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 32px 24px 28px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
    }

    .profile-card:hover {
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 0 0 45px rgba(56, 189, 248, 0.12);
    }

    .avatar-wrapper {
      position: relative;
      /* تم تكبير حجم الصورة من 86px إلى 124px */
      width: 124px;
      height: 124px;
      border-radius: 50%;
      padding: 3.5px;
      background: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #a855f7 100%);
      box-shadow: 0 10px 25px -4px rgba(56, 189, 248, 0.4), 0 0 20px rgba(99, 102, 241, 0.3);
      margin-bottom: 16px;
      flex-shrink: 0;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease;
    }

    .avatar-wrapper:hover {
      transform: scale(1.04);
      box-shadow: 0 12px 30px -4px rgba(56, 189, 248, 0.55), 0 0 28px rgba(168, 85, 247, 0.4);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background-color: #0b1120;
      display: block;
    }

    .user-name {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-title);
      line-height: 1.25;
      margin-bottom: 5px;
    }

    .user-role {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-subtitle);
      letter-spacing: 0.02em;
      margin-bottom: 22px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .user-role::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .action-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 48px;
      padding: 0 18px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 14px;
      color: var(--text-btn);
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      user-select: none;
    }

    .action-link:hover {
      background: var(--btn-bg-hover);
      border-color: var(--btn-border-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -2px rgba(0, 0, 0, 0.45);
    }

    .action-link:active {
      transform: scale(0.98);
    }

    .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      transition: transform 0.22s ease;
    }

    .action-link:hover .icon {
      transform: scale(1.15);
    }

    .icon-phone { color: #38bdf8; }
    .icon-wa { color: #22c55e; }
    .icon-email { color: #818cf8; }
    .icon-linkedin { color: #60a5fa; }
    .icon-github { color: #cbd5e1; }
    .icon-cv { color: #f43f5e; }
  </style>
</head>
